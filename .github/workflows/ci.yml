name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `make fmt` rewrites files, which would pass in CI no matter what.
      # Report the offending files and fail instead.
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "not gofmt'd:"
            echo "$files"
            exit 1
          fi

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: build
        run: make build
